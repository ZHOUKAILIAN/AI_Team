name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node scripts/release/release-tools.mjs verify-version --tag "${GITHUB_REF_NAME}"
      - id: release_type
        run: |
          RELEASE_ARGS="$(node scripts/release/release-tools.mjs release-type --version "${GITHUB_REF_NAME#v}" --github-args)"
          echo "github_args=${RELEASE_ARGS}" >> "${GITHUB_OUTPUT}"
      - run: mkdir -p dist/release
      - run: npm pack --pack-destination dist/release
      - run: node scripts/release/release-tools.mjs extract-changelog --version "${GITHUB_REF_NAME#v}" --changelog CHANGELOG.md > dist/release/CHANGELOG.md
      - run: |
          TARBALL_PATH=$(find dist/release -maxdepth 1 -name '*.tgz' | head -n 1)
          node scripts/release/release-tools.mjs render-install \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --version "${GITHUB_REF_NAME#v}" \
            --tarball "$(basename "${TARBALL_PATH}")" > dist/release/install.sh
          chmod +x dist/release/install.sh
      - run: |
          cd dist/release
          shasum -a 256 *.tgz install.sh CHANGELOG.md > SHA256SUMS
      - run: |
          test -f dist/release/CHANGELOG.md
          test -f dist/release/install.sh
          test -f dist/release/SHA256SUMS
          ls dist/release/*.tgz
      - run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/release/*.tgz \
            dist/release/install.sh \
            dist/release/SHA256SUMS \
            dist/release/CHANGELOG.md \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/release/CHANGELOG.md \
            ${{ steps.release_type.outputs.github_args }} \
            --draft
      - run: gh release edit "${GITHUB_REF_NAME}" --draft=false
